<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="metaTitle">Loading Article... | ZNN News</title>
    <meta name="description" id="metaDesc" content="Read the latest news on ZNN.">
    <link rel="icon" href="/logo.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="article-page-body">
    <div class="art-page-wrapper">
        <!-- PREMIUM STICKY HEADER -->
        <header class="art-header">
            <div class="art-header__inner">
                <a href="javascript:history.back()" class="art-header__action" title="Go Back">
                    <i class="fas fa-arrow-left"></i>
                </a>
                <a href="/" class="art-header__logo-container">
                    <img src="/logo.png" alt="ZNN" class="art-header__logo">
                </a>
                <a href="/" class="art-header__action" title="Home">
                    <i class="fas fa-home"></i>
                </a>
            </div>
        </header>

        <main class="art-container">
            <!-- LOADING STATE (Premium Skeletons) -->
            <div id="artSkeleton">
                <div class="art-skeleton art-skeleton-title"></div>
                <div class="art-skeleton art-skeleton-title" style="width: 50%;"></div>
                <div class="art-skeleton art-skeleton-banner"></div>
                <div class="art-skeleton art-skeleton-text"></div>
                <div class="art-skeleton art-skeleton-text"></div>
                <div class="art-skeleton art-skeleton-text"></div>
                <div class="art-skeleton art-skeleton-text" style="width: 80%;"></div>
            </div>

            <!-- ERROR STATE -->
            <div id="artError" style="display: none;" class="art-error">
                <i class="fas fa-exclamation-triangle"></i>
                <h2>Story Not Available</h2>
                <p id="errorMsg">The article you are looking for could not be loaded.</p>
                <a href="/" class="art-btn-home">Back to Newsroom</a>
            </div>

            <!-- PREMIUM ARTICLE CONTENT -->
            <article id="artContent" style="display: none;" class="art-card">
                <header>
                    <span id="artCategory" class="art-category">Category</span>
                    <h1 id="artTitle" class="art-title"></h1>
                    <div class="art-meta">
                        <span id="artAuthor" class="art-author">ZNN Editorial</span> • 
                        <span id="artDate"></span>
                    </div>
                </header>

                <img id="artHero" class="art-hero-img" src="" alt="">

                <div id="artBody" class="art-content">
                    <!-- Content injected here -->
                </div>

                <!-- SOCIAL SHARE BUTTONS -->
                <div class="art-share">
                    <button class="art-share-btn share-tw" title="Share on X"><i class="fab fa-x-twitter"></i></button>
                    <button class="art-share-btn share-fb" title="Share on Facebook"><i class="fab fa-facebook-f"></i></button>
                    <button class="art-share-btn share-wa" title="Share on WhatsApp"><i class="fab fa-whatsapp"></i></button>
                    <button class="art-share-btn share-copy" title="Copy Link"><i class="fas fa-link"></i></button>
                </div>
            </article>

            <!-- RELATED STORIES SECTION -->
            <section id="artRelated" class="art-related" style="display: none;">
                <h2 class="art-related-title">Related Stories</h2>
                <div id="relatedGrid" class="art-related-grid">
                    <!-- Related cards injected here -->
                </div>
            </section>
        </main>

        <!-- PREMIUM FOOTER -->
        <footer class="art-footer">
            <div class="wrap">
                <img src="/logo.png" alt="ZNN" class="art-footer-logo">
                <p class="art-footer-copy">&copy; 2026 ZNN - Zone News Network</p>
            </div>
        </footer>
    </div>

    <script src="article.js?v=3"></script>
</body>
</html>
